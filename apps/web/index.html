<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cerebro Académico · Universidad EAN</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Manrope: sustituto aprobado de Mikro. Open Sans: tipografía complementaria del manual. -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Open+Sans:wdth,wght@75..100,300..700&display=swap" rel="stylesheet" />
    <script>
      // Aplica el tema antes de pintar: preferencia guardada o la del sistema.
      (function () {
        var t = null;
        try { t = localStorage.getItem('cae-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
