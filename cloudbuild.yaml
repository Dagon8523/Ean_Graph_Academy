steps:
  - name: gcr.io/cloud-builders/docker
    id: build-api
    args:
      - build
      - -f
      - ops/docker/api.Dockerfile
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/ruta-ean-docker/ruta-ean-api:${_IMAGE_TAG}
      - .

  - name: gcr.io/cloud-builders/docker
    id: build-web
    args:
      - build
      - -f
      - ops/docker/web.Dockerfile
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/ruta-ean-docker/ruta-ean-web:${_IMAGE_TAG}
      - .

  - name: gcr.io/cloud-builders/docker
    id: push-api
    waitFor:
      - build-api
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/ruta-ean-docker/ruta-ean-api:${_IMAGE_TAG}

  - name: gcr.io/cloud-builders/docker
    id: push-web
    waitFor:
      - build-web
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/ruta-ean-docker/ruta-ean-web:${_IMAGE_TAG}

substitutions:
  _IMAGE_TAG: '${SHORT_SHA}'

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/ruta-ean-docker/ruta-ean-api:${_IMAGE_TAG}
  - us-central1-docker.pkg.dev/$PROJECT_ID/ruta-ean-docker/ruta-ean-web:${_IMAGE_TAG}

options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY
